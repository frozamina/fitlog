<body><main class="layout"><aside class="intro"><div class="brand"><span class="logo">F</span><strong>服集 <span style="font-family:Georgia,serif">FitLog</span></strong></div><span class="eyebrow">YOUR WARDROBE, YOUR WAY</span><h1>穿搭灵感，<br>从这一件开始。</h1><p>把已经决定穿的那件衣服作为起点，在衣橱里找到它的搭配。轻轻松松，留下每一种喜欢的组合。</p><div class="info"><span class="preview-tag">● 安卓界面交互预览</span><p>点击右侧屏幕操作，体验衣橱、单品、搭配和配色灵感。</p></div><p class="hint">预览中的衣物为示例。你可以直接告诉我哪一页、哪个细节需要调整。</p></aside><section class="phone" aria-label="模拟安卓手机"><div class="screen"><div class="status"><span id="time">9:41</span><span>◈ ▮▮▮ ▰</span></div><div class="camera"></div><header id="top" class="top"></header><div id="content" class="content"></div><nav id="nav" class="nav" aria-label="底部导航"></nav><div class="gesture"></div></div><div id="overlay"></div></section></main>
<script>
const KEY='fuji-demo-20261124';const seed=[{id:1,name:'宽松白衬衫',type:'上衣',brand:'日常衣橱',color:'#e7e5d9',fit:'宽松',favorite:true},{id:2,name:'直筒牛仔裤',type:'裤子',brand:'日常衣橱',color:'#8b9eaa',fit:'合身',favorite:false},{id:3,name:'鼠尾草绿针织衫',type:'上衣',brand:'日常衣橱',color:'#91a38c',fit:'合身',favorite:true},{id:4,name:'米白休闲鞋',type:'鞋履',brand:'日常衣橱',color:'#e6e1d3',fit:'合身',favorite:false},{id:5,name:'燕麦色外套',type:'外套',brand:'日常衣橱',color:'#c6bca9',fit:'宽松',favorite:false},{id:6,name:'深灰长裤',type:'裤子',brand:'日常衣橱',color:'#626d68',fit:'合身',favorite:false}];let data;try{data=JSON.parse(localStorage.getItem(KEY))||null}catch(e){}if(!data||!Array.isArray(data.items)||!Array.isArray(data.looks))data={items:seed,looks:[]};let state={page:'closet',category:'全部',query:'',favorite:false,palette:null,stack:[],selected:[],anchor:null,editing:null};const content=document.querySelector('#content'),topbar=document.querySelector('#top'),nav=document.querySelector('#nav'),overlay=document.querySelector('#overlay');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('浏览器存储空间不足，未保存')} }function icon(n){let p={closet:'M4 9l8-5 8 5M6 8v12h12V8M10 20v-6h4v6',outfits:'M12 3L3 8l9 5 9-5-9-5z M3 12l9 5 9-5 M3 16l9 5 9-5',inspiration:'M12 3a9 9 0 100 18h1a2 2 0 001.4-3.4 1.6 1.6 0 011.2-2.6H18a3 3 0 003-3 9 9 0 00-9-9z M8 10h.01 M12 7h.01 M16 10h.01',back:'M15 18l-6-6 6-6',settings:'M4 7h16M4 17h16M8 4v6M16 14v6',plus:'M12 5v14M5 12h14',heart:'M20.8 8.7c0 4.2-8.8 10-8.8 10S3.2 12.9 3.2 8.7a4.5 4.5 0 018.8-1.2 4.5 4.5 0 018.8 1.2z'};return `<svg class="small-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${p[n]||p.plus}"/></svg>`}function art(g){if(g.photo)return `<img src="${esc(g.photo)}" alt="${esc(g.name)}">`;let type=g.type,c=esc(g.color||'#bccbb9'),shape=type==='裤子'?'<path d="M36 12H84L82 55 73 110H58L60 56H57L50 110H35L37 55Z"/>':type==='鞋履'?'<path d="M18 70Q31 71 38 55L51 57Q54 70 69 72L92 78Q100 82 94 91H17Q10 87 18 70Z"/>':type==='外套'?'<path d="M42 10L30 14 12 33 23 43 31 36 29 106H91L89 36 97 43 108 33 90 14 78 10 60 26Z"/><path d="M60 26V105M42 11l18 15 18-15" fill="none" stroke="#7b8b79" stroke-width="1.5"/>':'<path d="M40 12L27 17 11 34 22 45 31 37 30 105H90L89 37 98 45 109 34 93 17 80 12Q72 23 60 23Q48 23 40 12Z"/><path d="M40 12Q60 33 80 12" fill="none" stroke="#7b8b79" stroke-width="1.5"/>';return `<svg viewBox="0 0 120 120" role="img" aria-label="${esc(g.type)}示意图"><g fill="${c}" stroke="#879888" stroke-width="1.2" stroke-linejoin="round">${shape}</g></svg>`}function byid(id){return data.items.find(x=>x.id==id)}function heading(a,b,c){return `<div class="heading"><div class="overline">${a}</div><h2>${b}</h2><p>${c}</p></div>`}function toast(t){let el=document.createElement('div');el.className='toast';el.textContent=t;document.querySelector('.phone').append(el);setTimeout(()=>el.remove(),2200)}function go(page,remember=true){if(remember&&state.page!==page)state.stack.push(state.page);state.page=page;render();content.scrollTop=0}function back(){state.page=state.stack.pop()||'closet';render();content.scrollTop=0}function head(title,root=false){topbar.innerHTML=root?`<div class="top-title">服集 <span style="font-family:Georgia,serif;font-weight:500">FitLog</span></div><button onclick="go('settings')">${icon('settings')} 我的</button>`:`<button class="back-title" onclick="back()">${icon('back')} ${title}</button>`}function bottom(show){nav.classList.toggle('hidden',!show);if(show)nav.innerHTML=[['closet','衣橱'],['outfits','搭配'],['inspiration','灵感']].map(([v,n])=>`<button class="${state.page===v?'active':''}" onclick="go('${v}',false)"><span class="navicon">${icon(v)}</span>${n}</button>`).join('')}
function closet(){let cats=['全部',...new Set(data.items.map(g=>g.type))];let shown=data.items.filter(g=>(state.category==='全部'||g.type===state.category)&&(!state.favorite||g.favorite)&&(!state.query||(g.name+g.brand).toLowerCase().includes(state.query.toLowerCase()))&&(!state.palette||state.palette.includes(g.color)));return `${heading('MY WARDROBE','我的衣橱','先选一件想穿的，再找到它的搭配。')}<div class="section-row"><span class="tiny">${data.items.length} 件衣物 · 示例数据</span><button class="btn" onclick="state.editing=null;go('edit')">＋ 录入衣物</button></div><input class="search" id="search" placeholder="⌕  搜索名称、品牌" value="${esc(state.query)}" oninput="state.query=this.value;renderList()"><div class="filters">${cats.map(c=>`<button class="chip ${state.category===c?'selected':''}" onclick="state.category='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div><label class="checkline"><input type="checkbox" ${state.favorite?'checked':''} onchange="state.favorite=this.checked;renderList()"> 只看收藏</label>${state.palette?'<div class="notice">正在查看相近色系 <button class="text-btn" onclick="state.palette=null;render()">清除筛选</button></div>':''}<div id="items">${tiles(shown)}</div>`}function tiles(arr){if(!arr.length)return `<div class="empty"><strong>没有找到匹配衣物</strong>试试调整搜索、分类或收藏条件。</div>`;return `<div class="grid">${arr.map(g=>`<div class="tile"><button class="picture" onclick="detail(${g.id})">${art(g)}</button><div class="tile-info"><div class="tile-name">${esc(g.name)}</div><div class="sub">${esc(g.type)} · ${esc(g.fit||'未标注')}</div><div class="tile-foot"><button class="text-btn" onclick="startStyle(${g.id})">用这件搭配</button><button class="icon-btn" aria-label="${g.favorite?'取消收藏':'收藏'}" onclick="favorite(${g.id})" style="color:${g.favorite?'#47765d':'#a6b6a8'}">${g.favorite?'♥':'♡'}</button></div></div></div>`).join('')}</div>`}function renderList(){let el=document.querySelector('#items');if(el){let a=data.items.filter(g=>(state.category==='全部'||g.type===state.category)&&(!state.favorite||g.favorite)&&(!state.query||(g.name+g.brand).toLowerCase().includes(state.query.toLowerCase()))&&(!state.palette||state.palette.includes(g.color)));el.innerHTML=tiles(a)}}function favorite(id){let g=byid(id);g.favorite=!g.favorite;save();render()}
function detail(id){state.current=id;go('detail')}function detailPage(){let g=byid(state.current);if(!g)return '<div class="empty">衣物不存在</div>';return `<div class="picture" style="height:260px">${art(g)}</div><div class="section-row"><div><h2 style="font-family:serif;margin:0">${esc(g.name)}</h2><p class="sub">${esc(g.type)} · ${esc(g.brand||'未记录品牌')}</p></div><button class="icon-btn" onclick="favorite(${g.id})">${g.favorite?'♥':'♡'}</button></div><button class="btn full" onclick="startStyle(${g.id})">用这件搭配</button><div class="card"><h3>衣物信息</h3><p>合身评价　${esc(g.fit||'未记录')}</p><p>尺码　　　${esc(g.size||'未记录')}</p><p>主色　　　<span style="display:inline-block;width:13px;height:13px;border-radius:50%;background:${esc(g.color)}"></span> ${esc(g.color)}</p><p>备注　　　${esc(g.note||'未记录')}</p></div><div class="row"><button class="btn outline" onclick="state.editing=${g.id};go('edit')">编辑衣物</button><button class="text-btn" onclick="go('compare')">尺码对照</button></div>`}
function edit(){let g=byid(state.editing)||{};return `<div class="form">${heading('ADD TO WARDROBE',state.editing?'编辑衣物':'录入衣物','先记录最重要的信息，其他以后再补。')}<label>衣物照片</label><label class="upload" for="photo">＋ 从设备选择照片<br><span class="tiny">可以稍后添加</span></label><input id="photo" type="file" accept="image/*" style="display:none" onchange="previewPhoto(this)"><div id="photoName" class="tiny"></div><label>名称</label><input id="name" placeholder="例如：宽松白衬衫" value="${esc(g.name||'')}"><label>衣物类别</label><select id="type">${['上衣','裤子','外套','鞋履','背心','帽子','配饰','包袋'].map(x=>`<option ${g.type===x?'selected':''}>${x}</option>`).join('')}</select><label>品牌</label><input id="brand" placeholder="选填" value="${esc(g.brand||'')}"><label>主色</label><input type="color" id="color" value="${esc(g.color||'#91a38c')}"><label>尺码</label><input id="size" placeholder="选填，如 M / L" value="${esc(g.size||'')}"><label>合身感受</label><select id="fit">${['合身','宽松','紧身'].map(x=>`<option ${g.fit===x?'selected':''}>${x}</option>`).join('')}</select><label>备注</label><textarea id="note" placeholder="穿着感受、面料或其他想记录的事">${esc(g.note||'')}</textarea><div style="height:20px"></div><button class="btn full" onclick="saveItem()">保存衣物</button><div style="height:18px"></div></div>`}let uploaded=null;function previewPhoto(i){if(!i.files[0])return;let r=new FileReader();r.onload=()=>{uploaded=r.result;document.querySelector('#photoName').textContent='已选择：'+i.files[0].name};r.readAsDataURL(i.files[0])}function saveItem(){let name=document.querySelector('#name').value.trim();if(!name)return toast('请填写衣物名称');let old=byid(state.editing),g={id:old?.id||Date.now(),name,type:document.querySelector('#type').value,brand:document.querySelector('#brand').value.trim(),color:document.querySelector('#color').value,fit:document.querySelector('#fit').value,size:document.querySelector('#size').value.trim(),note:document.querySelector('#note').value.trim(),favorite:old?.favorite||false,photo:uploaded||old?.photo||null};if(old)Object.assign(old,g);else data.items.unshift(g);uploaded=null;save();state.page='closet';state.stack=[];render();toast('已保存到预览')}
function startStyle(id){state.anchor=id;state.selected=[id];let a=byid(id);for(let t of ['上衣','裤子','鞋履']){let pick=data.items.find(x=>x.type===t&&x.id!==id&&t!==a.type);if(pick)state.selected.push(pick.id)}state.lookId=null;go('style')}function picker(mode,replace){let choices=data.items.filter(x=>mode==='anchor'||!state.selected.includes(x.id));overlay.innerHTML=`<div class="dialog-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="row"><h3>${mode==='anchor'?'选择起搭单品':mode==='replace'?'替换单品':'添加单品'}</h3><button class="text-btn" onclick="closeSheet()">关闭</button></div>${choices.length?choices.map(g=>`<button class="choice" onclick="choosePiece('${mode}',${g.id},${replace||0})">${esc(g.name)} <span class="tiny"> · ${esc(g.type)}</span></button>`).join(''):'<p class="tiny">暂无其他可选衣物</p>'}</div></div>`}function closeSheet(){overlay.innerHTML=''}function choosePiece(mode,id,replace){if(mode==='anchor'){state.selected=state.selected.filter(x=>x!==state.anchor);state.anchor=id;if(!state.selected.includes(id))state.selected.unshift(id)}else if(mode==='replace')state.selected=state.selected.map(x=>x===replace?id:x);else state.selected.push(id);closeSheet();render()}function stylePage(){if(!state.anchor)return heading('START WITH A PIECE','先选一件想穿的','推荐只会使用你已有的衣物。')+data.items.map(g=>`<button class="choice" onclick="startStyle(${g.id})">${esc(g.name)}</button>`).join('');let a=byid(state.anchor);return `${heading('STYLE AROUND IT','保留这一件，换出新的可能','搭配不绑定日期，可以反复修改和使用。')}<div class="notice">⌁ 起搭单品：<strong>${esc(a?.name||'')}</strong> <button class="text-btn" onclick="picker('anchor')">更换</button></div><div class="look-grid">${state.selected.map(id=>byid(id)).filter(Boolean).map(g=>`<div class="picture">${art(g)}</div>`).join('')}</div><div class="card">${state.selected.map(id=>{let g=byid(id);return g?`<div class="row"><span style="font-size:13px">${esc(g.name)} ${id===state.anchor?'<span class="tiny"> · 起搭</span>':''}</span>${id!==state.anchor?`<span><button class="text-btn" onclick="picker('replace',${id})">替换</button> <button class="icon-btn" style="display:inline-flex" onclick="state.selected=state.selected.filter(x=>x!==${id});render()">×</button></span>`:''}</div>`:''}).join('<div class="divider"></div>')}</div><button class="btn outline full" onclick="picker('add')">＋ 添加单品</button><h3 style="font-family:serif;margin-top:24px">配色思路</h3><div class="notice">中性色与柔和色调搭配，尝试用不同材质和明暗增加层次。<br>实际效果还取决于版型、材质和你的喜好。</div><div class="form"><label>搭配名称</label><input id="lookname" value="${esc(state.lookName||'日常搭配')}" placeholder="给这套搭配起个名字"><label>场合</label><input id="occasion" placeholder="例如：日常、通勤" value="${esc(state.occasion||'')}"></div><div style="height:20px"></div><button class="btn full" onclick="saveLook()">保存这套搭配</button><div style="height:15px"></div>`}function saveLook(){let name=document.querySelector('#lookname').value.trim()||'未命名搭配';let l={id:state.lookId||Date.now(),name,occasion:document.querySelector('#occasion').value,ids:[...state.selected],anchor:state.anchor};let idx=data.looks.findIndex(x=>x.id===l.id);if(idx>=0)data.looks[idx]=l;else data.looks.unshift(l);save();state.anchor=null;state.lookId=null;state.lookName='';state.occasion='';state.page='outfits';state.stack=[];render();toast('搭配已保存到预览')}function editLook(id,copy=false){let l=data.looks.find(x=>x.id===id);if(!l)return;state.lookId=copy?null:l.id;state.lookName=l.name+(copy?' · 新版本':'');state.occasion=l.occasion||'';state.anchor=l.anchor;state.selected=l.ids.filter(x=>byid(x));go('style')}function outfits(){return `${heading('YOUR COMBINATIONS','我的搭配','把喜欢的组合留下，下次直接拿来穿。')}<button class="btn" onclick="state.anchor=null;state.lookId=null;state.lookName='';state.occasion='';go('style')">＋ 新建搭配</button>${data.looks.length?data.looks.map(l=>`<div class="card"><h3>${esc(l.name)}</h3><p>${esc(l.occasion||'日常搭配')} · ${l.ids.length} 件单品</p><div class="look-grid">${l.ids.map(byid).filter(Boolean).map(g=>`<div class="picture">${art(g)}</div>`).join('')}</div><div class="row"><button class="text-btn" onclick="editLook(${l.id})">编辑搭配</button><button class="text-btn" onclick="editLook(${l.id},true)">另存新搭配</button><button class="text-btn" onclick="if(confirm('删除这套示例搭配？')){data.looks=data.looks.filter(x=>x.id!==${l.id});save();render()}">删除</button></div></div>`).join(''):'<div class="empty"><strong>还没有保存搭配</strong>先选一件想穿的，其他部分可以慢慢调整。</div>'}`}
let palettes=[{name:'蓝灰之间',text:'柔和的蓝色做主角，灰色稳定整体，浅色留出呼吸感。',colors:['#A9BEC7','#555C5B','#E8E5DA']},{name:'柔和大地色',text:'灰绿与燕麦色相互衔接，奶白提亮。不同材质让近似色更有层次。',colors:['#788674','#C4B9A4','#E8E5DA']},{name:'黑白有层次',text:'把注意力留给剪裁与面料，在黑白之间加入灰色，让过渡更柔和。',colors:['#292D2C','#A7ADB5','#F5F3EE']}];function inspirations(){return `${heading('COLOUR & IDEAS','配色灵感','好看的颜色，最终落到你自己的衣物上。')}${palettes.map((p,i)=>`<div class="card"><h3>${p.name}</h3><p>${p.text}</p><div class="palette">${p.colors.map(c=>`<div style="background:${c}"></div>`).join('')}</div><button class="text-btn" onclick="paletteFilter(${i})">在衣橱中寻找相近颜色</button></div>`).join('')}<div class="notice">这是配色灵感示例，不代表你的个人四季色彩结论。主色可以在衣物编辑中修正。</div><button class="text-btn" onclick="state.anchor=null;go('style')">从一件已有单品开始搭配</button>`}function paletteFilter(i){let groups=[["#8b9eaa","#626d68","#e7e5d9"],["#91a38c","#c6bca9","#e6e1d3","#e7e5d9"],["#626d68","#e7e5d9","#e6e1d3"]];state.palette=groups[i];state.category='全部';state.page='closet';render();toast('已筛选示例相近颜色')}
function settings(){return `<div class="card"><h3>数据管理</h3>${[['身体与尺码','body'],['导出备份','export'],['导入恢复','import'],['属性模板','templates'],['关于 服集 FitLog','about']].map(([a,b])=>`<button class="choice" onclick="settingAction('${b}')">${a} <span style="float:right;color:#9bac9e">›</span></button>`).join('')}</div><div class="notice">这是独立的交互预览，示例数据保存在当前浏览器，不会读取手机 App 的数据。</div><button class="text-btn" onclick="if(confirm('重置全部示例衣物与搭配？')){data={items:structuredClone(seed),looks:[]};save();state.category='全部';state.query='';state.favorite=false;state.palette=null;toast('已恢复示例数据');render()}">恢复示例数据</button>`}function settingAction(t){if(t==='body'||t==='templates'||t==='about'){state.sub=t;go('sub')}else toast('预览版不执行真实备份操作')}function sub(){if(state.sub==='about')return '<div class="card"><h3>服集 FitLog</h3><p>安卓页面交互预览 · 基于 v0.4.1 设计</p><p>用于讨论页面布局与交互细节。</p></div>';if(state.sub==='body')return `${heading('BODY PROFILE','身体与尺码','记录身体数据，方便以后对照。')}<div class="form">${['身高（cm）','体重（kg）','胸围（cm）','腰围（cm）','臀围（cm）','肩宽（cm）'].map(t=>`<label>${t}</label><input inputmode="decimal" placeholder="未记录">`).join('')}<div style="height:18px"></div><button class="btn full" onclick="toast('仅演示页面，不会保存身体数据')">保存身体数据</button></div>`;return '<div class="card"><h3>属性模板</h3><p>上衣：衣长 · 胸围 · 肩宽</p><p>裤子：裤长 · 腰围 · 臀围</p><p>可在实际 App 中管理属性模板。</p></div>'}
function render(){let root=['closet','outfits','inspiration'].includes(state.page);head(({detail:'衣物详情',edit:state.editing?'编辑衣物':'录入衣物',style:'搭配',settings:'我的',sub:state.sub==='body'?'身体与尺码':state.sub==='templates'?'属性模板':'关于',compare:'尺码对照'})[state.page]||'',root);bottom(root);content.innerHTML=({closet,outfits,inspiration:inspirations,detail:detailPage,edit,style:stylePage,settings,sub,compare:()=>heading('FIT REFERENCE','用熟悉的衣物作参照','测量口径、单位不清晰时，只并排展示。')+'<div class="notice">此页面为交互预览；真实尺寸比较以 Android 应用为准。</div>'})[state.page]();}render();
</script></body></html>
